name: Windows installer
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/verify-azure-signing.yml'
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      kind: ${{ steps.release.outputs.kind }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check application tests
        run: |
          node --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test --prefix desktop
      - name: Download pinned llama.cpp CPU runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/ggml-org/llama.cpp/releases/download/b12421/llama-b12421-bin-win-cpu-x64.zip'
          Invoke-WebRequest $url -OutFile llama.zip
          if ((Get-FileHash llama.zip -Algorithm SHA256).Hash.ToLower() -ne 'f1f53e34f24a8627991d90a1b85296b21f7cdac1c20241b9ecdf508b839ac28c') { throw 'Runtime checksum mismatch' }
          Expand-Archive llama.zip llama
          $cli = Get-ChildItem llama -Recurse -Filter llama-cli.exe | Select-Object -First 1
          if (!$cli) { throw 'Runtime is missing llama-cli.exe' }
          "LLAMA_DIRECTORY=$($cli.Directory.FullName)" >> $env:GITHUB_ENV
          & $cli.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime failed to start' }
      - name: Authenticate to Azure for beta signing
        if: github.ref == 'refs/heads/main'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: 37629a79-e7bd-4291-bfff-33f14b298ac9
          tenant-id: b35ef5fc-5945-48d2-aca7-74e9e1e7359a
          allow-no-subscriptions: true
      - name: Build Windows installer
        id: release
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AGENETIC_SIGNER_THUMBPRINT: ${{ secrets.AGENETIC_SIGNER_THUMBPRINT }}
          AGENETIC_UPDATE_SIGNING_KEY: ${{ secrets.AGENETIC_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'desktop/package.json must have a stable base version.' }
          $kind = 'preview'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match desktop package version.' }
            $kind = 'stable'
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            $kind = 'beta'
            $version = "$version-beta.$env:GITHUB_RUN_NUMBER"
            Push-Location desktop
            try {
              npm version $version --no-git-tag-version
              if ($LASTEXITCODE -ne 0) { throw 'Could not set beta app version.' }
              node -e "const fs = require('node:fs');const p = require('./package.json');Object.assign(p.build.publish[0],{channel:'beta',releaseType:'prerelease'});fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"
              if ($LASTEXITCODE -ne 0) { throw 'Could not configure the beta update feed.' }
            } finally { Pop-Location }
          }
          if ($kind -eq 'preview' -and !$env:CSC_LINK) {
            Write-Host 'No signing identity configured. Building a manual-install preview.'
          }
          if ($kind -eq 'preview') {
            ./desktop/scripts/build-windows.ps1 -LlamaDirectory $env:LLAMA_DIRECTORY
          } else {
            if ($kind -eq 'beta') {
              ./desktop/scripts/build-windows.ps1 -Release -AzureSigning -Channel beta -LlamaDirectory $env:LLAMA_DIRECTORY
            } else {
              ./desktop/scripts/build-windows.ps1 -Release -Channel stable -LlamaDirectory $env:LLAMA_DIRECTORY
            }
            $manifest = if ($kind -eq 'beta') { 'beta.yml' } else { 'latest.yml' }
            $manifestPath = Join-Path $env:GITHUB_WORKSPACE "desktop/release/$manifest"
            if (!(Test-Path $manifestPath)) { throw "Signed installer is missing $manifest." }
            $escaped = [regex]::Escape($version)
            if ((Get-Content $manifestPath -Raw) -notmatch "(?m)^version:\s+$escaped\s*$") { throw 'Update manifest version does not match the installer.' }
          }
          "kind=$kind" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify GGUF registration and inference with the packaged Windows runtime
        shell: pwsh
        run: |
          $modelUrl = 'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf'
          Invoke-WebRequest $modelUrl -OutFile smoke.gguf
          if ((Get-FileHash smoke.gguf -Algorithm SHA256).Hash.ToLower() -ne '270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d') { throw 'Smoke-test GGUF checksum mismatch' }
          $runtime = 'desktop/release/win-unpacked/resources/runtime'
          python desktop/scripts/check-companion.py "$runtime/agenetic-companion.exe" "$runtime/llama-cli.exe" smoke.gguf
      - name: Record artifact hashes
        shell: pwsh
        run: |
          Get-ChildItem desktop/release/*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content desktop/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Agenetic-Windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/*.yml
            desktop/release/*.json
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Agenetic-Windows-installer
          path: release
      - name: Publish download and patch notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_KIND: ${{ needs.build.outputs.kind }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          installer="release/Agenetic-Setup-${VERSION}-x64.exe"
          test -s "$installer"
          test -s release/SHA256SUMS.txt
          (cd release && tr -d '\r' < SHA256SUMS.txt | sha256sum -c -)
          args=(--verify-tag)
          case "$RELEASE_KIND" in
            stable) tag="v$VERSION"; title="Agenetic $VERSION"; args+=(--latest);;
            beta) tag="v$VERSION"; title="Agenetic $VERSION"; args+=(--prerelease);;
            preview) tag="preview-$GITHUB_RUN_NUMBER"; title="Agenetic $VERSION · beta preview"; args=(--prerelease);;
            *) exit 1;;
          esac
          if test "$RELEASE_KIND" = beta; then
            latest_run=$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName' |
              sed -nE 's/^v[0-9]+\.[0-9]+\.[0-9]+-beta\.([0-9]+)$/\1/p' | sort -nr | sed -n '1p')
            if test -n "$latest_run" && test "$latest_run" -gt "$GITHUB_RUN_NUMBER"; then
              echo 'A newer beta build has already been published.'
              exit 0
            fi
            # A release created with GITHUB_TOKEN doesn't trigger another workflow.
            remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if test -n "$remote_sha"; then
              test "$remote_sha" = "$COMMIT_SHA"
            else
              git tag "$tag" "$COMMIT_SHA"
              git push origin "refs/tags/$tag"
            fi
          fi
          if gh release view "$tag" --json isDraft --jq '.isDraft' >/tmp/agenetic-draft; then
            if test "$(cat /tmp/agenetic-draft)" = false; then
              echo 'This release has already been published.'
              exit 0
            fi
            echo 'An unpublished draft for this tag exists. Resolve it before retrying.'
            exit 1
          fi
          notes=$(mktemp)
          {
            printf '## Changes\n\n'
            base_version="${VERSION%%-beta.*}"
            awk -v heading="## $base_version" '$0 == heading {show=1; next} /^## / {show=0} show' CHANGELOG.md
            printf '\n## Install and update\n\n'
            if test "$RELEASE_KIND" = preview; then
              printf 'Download the Windows x64 setup EXE below. This preview is unsigned and updates are installed manually.\n'
            else
              printf 'Download the Windows x64 setup EXE for a first install or to move from an unsigned preview. Signed builds on this channel check GitHub for updates and install them when Agenetic closes.\n'
            fi
            printf '\n[Report a beta issue](https://github.com/%s/issues/new/choose) · [Full changelog](https://github.com/%s/blob/main/CHANGELOG.md)\n' "$GH_REPO" "$GH_REPO"
            printf '\nSource commit: [`%s`](https://github.com/%s/commit/%s)\n' "${COMMIT_SHA:0:7}" "$GH_REPO" "$COMMIT_SHA"
          } > "$notes"
          assets=("$installer" release/SHA256SUMS.txt)
          if test "$RELEASE_KIND" != preview; then
            manifest=latest.yml
            if test "$RELEASE_KIND" = beta; then manifest=beta.yml; fi
            test -s "release/$manifest"
            assets+=("release/$manifest")
            if test -f "$installer.blockmap"; then assets+=("$installer.blockmap"); fi
            if test -f release/signed-manifest.json; then assets+=(release/signed-manifest.json); fi
          fi
          gh release create "$tag" --target "$COMMIT_SHA" --title "$title" --notes-file "$notes" "${args[@]}" "${assets[@]}"
  verify-beta-update:
    needs: [build, publish]
    if: needs.build.outputs.kind == 'beta'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the previous beta and verify automatic update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: node desktop/scripts/check-beta-update.mjs
